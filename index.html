<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftShare P2P - Chat & Transfer</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-active { border-bottom: 3px solid #4f46e5; color: #4f46e5; }
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <div class="max-w-md mx-auto py-8 px-4">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-indigo-900 tracking-tight">SwiftShare</h1>
            <div id="status" class="mt-2 inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-800 transition-all">
                <span class="w-2 h-2 mr-2 rounded-full bg-red-500 animate-pulse"></span>
                OFFLINE
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100">
            
            <div class="flex border-b border-slate-100 bg-slate-50/50" id="nav-tabs">
                <button onclick="switchTab('my-id')" id="tab-my-id" class="flex-1 py-4 text-sm font-bold tab-active">MY QR/ID</button>
                <button onclick="switchTab('connect')" id="tab-connect" class="flex-1 py-4 text-sm font-bold text-slate-400">CONNECT</button>
            </div>

            <div class="p-6">
                <div id="pane-my-id" class="space-y-6">
                    <div class="text-center">
                        <div id="qrcode" class="bg-white p-4 inline-block rounded-2xl border-4 border-indigo-50 shadow-sm mb-4"></div>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Your Peer ID</p>
                        <code id="display-id" class="text-indigo-600 font-mono text-lg font-bold">Initializing...</code>
                    </div>
                </div>

                <div id="pane-connect" class="hidden">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Remote Peer ID</label>
                            <input type="text" id="remote-id" placeholder="Paste friend's ID here..." 
                                class="w-full px-4 py-4 rounded-2xl bg-slate-100 border-none focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700">
                        </div>
                        <button onclick="connectToPeer()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-indigo-200">
                            Connect Now
                        </button>
                    </div>
                </div>

                <div id="active-session" class="hidden space-y-6">
                    <div class="flex items-center justify-between bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                        <span class="text-emerald-800 text-sm font-bold">Connected to Peer</span>
                        <button onclick="location.reload()" class="text-xs bg-emerald-200 text-emerald-900 px-2 py-1 rounded-lg">End</button>
                    </div>

                    <div id="chat-box" class="h-64 overflow-y-auto flex flex-col gap-2 p-2 bg-slate-50 rounded-2xl border border-slate-100">
                        <p class="text-[10px] text-center text-slate-400 uppercase font-bold my-2">End-to-End Encrypted Chat</p>
                    </div>
                    
                    <div class="flex gap-2">
                        <input type="text" id="chat-input" placeholder="Type message..." class="flex-1 px-4 py-3 rounded-xl bg-slate-100 border-none focus:ring-2 focus:ring-indigo-500 outline-none">
                        <button onclick="sendChat()" class="bg-indigo-600 text-white p-3 rounded-xl">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                            </svg>
                        </button>
                    </div>

                    <div class="pt-4 border-t border-slate-100">
                        <input type="file" id="file-input" class="hidden" onchange="updateFileLabel()">
                        <label for="file-input" class="flex items-center justify-center w-full py-3 border-2 border-dashed border-slate-300 rounded-2xl cursor-pointer hover:border-emerald-500 transition-colors">
                            <span id="file-label" class="text-sm font-medium text-slate-500">Choose File to Share</span>
                        </label>
                        <button onclick="sendFile()" class="w-full mt-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-2xl transition-all shadow-lg shadow-emerald-100">
                            Send File
                        </button>
                        
                        <div id="progress-container" class="hidden mt-4">
                            <div class="w-full bg-slate-200 rounded-full h-2">
                                <div id="progress-bar" class="bg-emerald-500 h-2 rounded-full transition-all" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="received-files" class="mt-4 space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;

        function initPeer() {
            peer = new Peer();

            peer.on('open', (id) => {
                document.getElementById('display-id').innerText = id;
                updateStatus('ONLINE', 'emerald');
                generateQR(id);
                checkUrlParams();
            });

            peer.on('connection', (connection) => {
                setupConnection(connection);
            });
        }

        function setupConnection(connection) {
            conn = connection;
            
            conn.on('open', () => {
                updateStatus('CONNECTED', 'emerald');
                document.getElementById('active-session').classList.remove('hidden');
                document.getElementById('pane-my-id').classList.add('hidden');
                document.getElementById('pane-connect').classList.add('hidden');
                document.getElementById('nav-tabs').classList.add('hidden');
            });

            conn.on('data', (data) => {
                if (data.type === 'text') {
                    appendMessage('Friend', data.content, 'bg-white self-start border border-slate-200 text-slate-800');
                } else if (data.type === 'file') {
                    renderDownloadLink(data);
                }
            });
        }

        function connectToPeer(remoteId = null) {
            const id = remoteId || document.getElementById('remote-id').value;
            if (!id) return alert('Please enter an ID');
            setupConnection(peer.connect(id));
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            if (!input.value || !conn) return;
            conn.send({ type: 'text', content: input.value });
            appendMessage('You', input.value, 'bg-indigo-600 self-end text-white');
            input.value = '';
        }

        function appendMessage(sender, text, style) {
            const box = document.getElementById('chat-box');
            const msg = document.createElement('div');
            msg.className = `p-3 rounded-2xl max-w-[85%] text-sm shadow-sm ${style}`;
            msg.innerHTML = `<span class="block text-[9px] opacity-70 font-bold uppercase">${sender}</span>${text}`;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        function sendFile() {
            const file = document.getElementById('file-input').files[0];
            if (!file || !conn) return alert('Select a file first');

            document.getElementById('progress-container').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = '100%';

            conn.send({
                file: file,
                filename: file.name,
                filetype: file.type,
                type: 'file'
            });

            setTimeout(() => {
                alert('File sent to peer!');
                document.getElementById('progress-container').classList.add('hidden');
                document.getElementById('progress-bar').style.width = '0%';
                document.getElementById('file-label').innerText = "Choose File to Share";
            }, 1000);
        }

        function renderDownloadLink(data) {
            const blob = new Blob([data.file], { type: data.filetype });
            const url = URL.createObjectURL(blob);
            const div = document.createElement('div');
            div.className = "p-4 bg-emerald-50 border border-emerald-100 rounded-2xl flex justify-between items-center animate-bounce";
            div.innerHTML = `
                <div class="overflow-hidden"><p class="text-xs font-bold text-emerald-800 truncate">${data.filename}</p></div>
                <a href="${url}" download="${data.filename}" class="ml-2 bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold">Download</a>
            `;
            document.getElementById('received-files').prepend(div);
        }

        function generateQR(id) {
            const url = `${window.location.origin}${window.location.pathname}?peer=${id}`;
            new QRCode(document.getElementById("qrcode"), {
                text: url, width: 180, height: 180, colorDark : "#4f46e5", colorLight : "#ffffff"
            });
        }

        function checkUrlParams() {
            const peerId = new URLSearchParams(window.location.search).get('peer');
            if (peerId) connectToPeer(peerId);
        }

        function updateFileLabel() {
            const file = document.getElementById('file-input').files[0];
            if (file) document.getElementById('file-label').innerText = file.name;
        }

        function updateStatus(text, color) {
            const el = document.getElementById('status');
            el.innerHTML = `<span class="w-2 h-2 mr-2 rounded-full bg-${color}-500 shadow-lg"></span>${text}`;
            el.className = `mt-2 inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-${color}-100 text-${color}-800 transition-all`;
        }

        function switchTab(tab) {
            document.getElementById('pane-my-id').classList.toggle('hidden', tab !== 'my-id');
            document.getElementById('pane-connect').classList.toggle('hidden', tab !== 'connect');
            document.getElementById('tab-my-id').className = tab === 'my-id' ? 'flex-1 py-4 text-sm font-bold tab-active' : 'flex-1 py-4 text-sm font-bold text-slate-400';
            document.getElementById('tab-connect').className = tab === 'connect' ? 'flex-1 py-4 text-sm font-bold tab-active' : 'flex-1 py-4 text-sm font-bold text-slate-400';
        }

        initPeer();
    </script>
</body>
</html>
